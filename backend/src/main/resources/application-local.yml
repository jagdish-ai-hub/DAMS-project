# Local dev profile. Database is the same shared Neon instance (test phase) — the
# connection is supplied via SPRING_DATASOURCE_URL (see application.yml).
spring:
  jpa:
    show-sql: false

dams:
  cors:
    # Allow any port on localhost / 127.0.0.1 for local dev so frontends on any unique port work seamlessly
    allowed-origins: "http://localhost:*,http://127.0.0.1:*,http://[::1]:*"
  jwt:
    # Local convenience only — a 30-day token so Swagger / the app don't log you out
    # mid-session. Prod keeps the 8h default from application.yml.
    access-token-expiry-hours: 720
