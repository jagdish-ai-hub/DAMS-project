spring:
  application:
    name: dams
  datasource:
    # Single shared Neon (hosted Postgres) instance for every environment during the test phase.
    # Never commit the real URL — supply it via the SPRING_DATASOURCE_URL env var.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # Neon is remote Postgres; establishing a fresh connection costs ~0.5-2.4s (TLS +
      # backend spin-up). This pool used to be fixed-size (minimum-idle == maximum-pool-size
      # == 8) to never pay that cost — but that also meant 8 connections stayed open to Neon
      # 24/7, which pins the compute permanently active and burns free-tier compute hours
      # even with nobody using the app (rev 42, plan.md). So:
      #  - minimum-idle 0: during genuine inactivity the pool can drain to zero connections,
      #    letting Neon's own autosuspend actually see an idle compute. Real traffic still
      #    scales the pool up to maximum-pool-size within one request's connection-timeout.
      #  - idle-timeout below Neon's suspend window: connections above the (now 0) floor
      #    retire once truly idle, rather than sitting warm forever waiting to be reused.
      #  - keepalive-time < idle-timeout, so a connection still in the pool stays valid on
      #    Neon's side right up until Hikari itself retires it.
      #  - max-lifetime long (25 min): retire connections rarely otherwise; each retirement
      #    is one reconnect. (Neon's own server-side limit is generous on the pooled path.)
      # Trade-off accepted: the first request after a real idle stretch (e.g. overnight, no
      # cashier active) pays one reconnect/wake cost instead of being instant.
      auto-commit: false
      maximum-pool-size: 8
      minimum-idle: 0
      connection-timeout: 15000
      idle-timeout: 300000
      keepalive-time: 60000
      max-lifetime: 1500000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # One round-trip per batch instead of one per row when Hibernate resolves lazy
        # associations / collections for a list of parents (queues, dashboard, My Entries).
        default_batch_fetch_size: 64
        jdbc:
          batch_size: 32
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        connection:
          # Hibernate manages the transaction boundary; don't let the driver autocommit
          # each statement (saves a round-trip on every read-only transaction to Neon).
          provider_disable_autocommit: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Keep the pasted bearer token across page reloads, and show call timings.
    persist-authorization: true
    display-request-duration: true

dams:
  jwt:
    secret: ${JWT_SECRET:dams-local-dev-secret-do-not-use-in-production-min-32-chars}
    access-token-expiry-hours: 8
  app:
    # Frontend origin — used to build accept-invite links
    base-url: ${APP_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # "local" (default) writes attachment bytes to disk and serves them via signed URLs
    # from this app; "r2" uses Cloudflare R2 (see R2StorageService).
    provider: ${DAMS_STORAGE_PROVIDER:local}
    local:
      dir: ${DAMS_STORAGE_LOCAL_DIR:${java.io.tmpdir}/dams-storage}
      # Public URL of THIS backend — used to build signed attachment-download links.
      public-base-url: ${DAMS_STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:8080}
    r2:
      # Only read when provider=r2. endpoint is https://<accountid>.r2.cloudflarestorage.com
      endpoint: ${R2_ENDPOINT:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}

logging:
  pattern:
    console: "%d{HH:mm:ss} [%X{requestId}] [org:%X{orgId}] %-5level %logger{36} - %msg%n"
