name: CI / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to (re)deploy or roll back to, e.g. sha-abc1234 or latest"
        required: true
        default: latest

# One main-branch pipeline at a time; never cancel a run mid-deploy.
concurrency:
  group: dams-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Non-secret deploy config — kept here rather than in GitHub Variables/Secrets.
  # The only secret the deploy needs is DEPLOY_SSH_KEY.
  DEPLOY_HOST: 66.116.244.178
  DEPLOY_USER: server
  DEPLOY_PATH: /home/server/dams
  VITE_API_URL: https://dams.jjsoftware.in

jobs:
  # ------------------------------------------------------- backend test gate
  # Full suite: 200+ unit/guard tests, the Testcontainers cross-org isolation
  # test, and the JaCoCo money-logic coverage floor (see backend/pom.xml).
  backend:
    name: Backend — build, test & coverage
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - name: Summarise backend results
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          run = fail = err = skip = 0
          for f in glob.glob('target/surefire-reports/*.xml'):
              r = ET.parse(f).getroot()
              run += int(r.get('tests', 0)); fail += int(r.get('failures', 0))
              err += int(r.get('errors', 0)); skip += int(r.get('skipped', 0))
          print(f"## Backend — {run} tests, {fail + err} failed, {skip} skipped")
          try:
              j = ET.parse('target/site/jacoco/jacoco.xml').getroot()
              for c in j.findall('counter'):
                  if c.get('type') == 'LINE':
                      cov, mis = int(c.get('covered')), int(c.get('missed'))
                      print(f"Line coverage: {cov * 100 // (cov + mis)}% (gate: 45%)")
          except FileNotFoundError:
              print("JaCoCo report missing")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 14

  # ------------------------------------------------------ frontend unit gate
  frontend-unit:
    name: Frontend — lint, typecheck, unit
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run --reporter=junit --outputFile=test-results/vitest-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-reports
          path: frontend/test-results/
          retention-days: 14

  # ---------------------------------------------------------- browser E2E
  # Multi-role flows (auth, cashier, review, owner) against the production
  # build with the API mocked at the network layer — no database needed.
  frontend-e2e:
    name: Frontend — Playwright E2E
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # ------------------------------------------------------------ API smoke
  # Boots the real backend against throwaway Postgres and proves the wiring:
  # health, OpenAPI docs, and the security chain (401s, never 500s).
  api-smoke:
    name: API — boot & smoke
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dams_smoke
          POSTGRES_USER: dams
          POSTGRES_PASSWORD: dams
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -DskipTests package
      - name: Boot backend and probe it
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dams_smoke
          SPRING_DATASOURCE_USERNAME: dams
          SPRING_DATASOURCE_PASSWORD: dams
        run: |
          set -euo pipefail
          java -jar target/*.jar > /tmp/dams-smoke.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID" EXIT
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "backend never became healthy"; tail -n 80 /tmp/dams-smoke.log; exit 1; }
          echo "### API smoke" >> "$GITHUB_STEP_SUMMARY"
          check() { # check <desc> <curl-args...> -- <expected-status>
            local desc="$1"; shift
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" "$@")
            echo "- $desc → HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" = "$SMOKE_EXPECT" ] || { echo "SMOKE FAIL: $desc → $code (wanted $SMOKE_EXPECT)"; return 1; }
          }
          SMOKE_EXPECT=200 check "health is UP" http://127.0.0.1:8080/actuator/health
          SMOKE_EXPECT=200 check "OpenAPI docs serve" http://127.0.0.1:8080/api-docs
          SMOKE_EXPECT=401 check "dashboard without token is refused" http://127.0.0.1:8080/api/v1/dashboard/summary?period=today
          SMOKE_EXPECT=401 check "bad login is refused, not a 500" \
            -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"nobody@x.in","password":"wrong"}'
          echo "smoke OK" >> "$GITHUB_STEP_SUMMARY"
      - name: Backend log on failure
        if: failure()
        run: tail -n 120 /tmp/dams-smoke.log

  # ------------------------------------------------------- deploy decision
  # Single required check: deploy (and images) only run when every gate above
  # is green. Add THIS context to branch protection, not the individual jobs.
  quality-gate:
    name: Quality gate — all tests green
    needs: [backend, frontend-unit, frontend-e2e, api-smoke]
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "### Quality gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- backend: ${{ needs.backend.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- frontend-unit: ${{ needs.frontend-unit.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- frontend-e2e: ${{ needs.frontend-e2e.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- api-smoke: ${{ needs.api-smoke.result }}" >> "$GITHUB_STEP_SUMMARY"
          for r in "${{ needs.backend.result }}" "${{ needs.frontend-unit.result }}" \
                   "${{ needs.frontend-e2e.result }}" "${{ needs.api-smoke.result }}"; do
            [ "$r" = "success" ] || { echo "QUALITY GATE FAILED ($r)"; exit 1; }
          done
          echo "QUALITY GATE PASSED — safe to build and deploy" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------- build & push images
  images:
    name: Build & push images
    needs: [quality-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - id: repo
        # OCI image names must be lowercase; the repo slug may not be.
        run: echo "lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}-${{ matrix.name }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}-${{ matrix.name }}:latest
          # Layer cache in GitHub — keeps `mvn dependency:go-offline` (~4 min cold) fast.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Frontend bakes the API origin in at build time; backend ignores it.
          build-args: ${{ matrix.name == 'frontend' && format('VITE_API_URL={0}', env.VITE_API_URL) || '' }}

  # -------------------------------------------------------------------- deploy
  deploy:
    name: Deploy to VPS
    needs: [images]
    # Runs after a successful image build on push, OR directly on a manual dispatch
    # (which redeploys / rolls back to inputs.tag without rebuilding).
    if: >
      always() &&
      (
        (github.event_name == 'push' && needs.images.result == 'success') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dams-deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          test -s ~/.ssh/id_ed25519 || { echo "::error::DEPLOY_SSH_KEY secret is empty or unset"; exit 1; }
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null || { echo "::error::DEPLOY_SSH_KEY is not a valid private key"; exit 1; }

      - name: Ship compose file
        env:
          DEST: ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            compose.prod.yml "$DEST:$DEPLOY_PATH/compose.prod.yml"

      - name: Deploy — pull, health-check, auto-rollback
        env:
          DEST: ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}
          NEW_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$DEST" "APP_DIR='$DEPLOY_PATH' NEW_TAG='$NEW_TAG' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          cf=compose.prod.yml
          compose() { docker compose -f "$cf" "$@"; }

          # The tag currently serving traffic — the rollback target. Empty on the first deploy.
          OLD_TAG="$(docker inspect --format '{{ index .Config.Image }}' dams-backend-1 2>/dev/null | sed 's/.*://' || true)"
          echo "currently running: ${OLD_TAG:-<none>}   ->   deploying: $NEW_TAG"

          roll() {
            DAMS_TAG="$1" compose pull --quiet
            DAMS_TAG="$1" compose up -d --remove-orphans
          }

          healthy() {
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8082/actuator/health >/dev/null 2>&1 \
                 && curl -fsS http://127.0.0.1:8083/            >/dev/null 2>&1; then
                return 0
              fi
              sleep 3
            done
            return 1
          }

          roll "$NEW_TAG"
          if healthy; then
            echo "OK: $NEW_TAG healthy"
            # keep the two most recent images per repo, drop the rest
            docker image prune -f >/dev/null 2>&1 || true
            exit 0
          fi

          echo "FAIL: $NEW_TAG unhealthy after ~90s"
          docker logs dams-backend-1  --tail 60 2>&1 | sed 's/^/  backend| /' || true
          docker logs dams-frontend-1 --tail 20 2>&1 | sed 's/^/  frontend| /' || true

          if [ -n "$OLD_TAG" ] && [ "$OLD_TAG" != "$NEW_TAG" ]; then
            echo "Rolling back to $OLD_TAG ..."
            roll "$OLD_TAG"
            if healthy; then echo "rolled back to $OLD_TAG — site is up on the previous version"
            else echo "WARNING: rollback to $OLD_TAG is also unhealthy — manual attention needed"; fi
          else
            echo "No previous version to roll back to."
          fi
          exit 1
          REMOTE
