# DAMS host nginx — put at /etc/nginx/sites-available/dams and symlink into sites-enabled.
# Then:  certbot --nginx -d dams.example.com   (certbot rewrites this to add the 443 block).
#
#   sudo cp deploy/nginx-dams.conf /etc/nginx/sites-available/dams
#   sudo ln -s /etc/nginx/sites-available/dams /etc/nginx/sites-enabled/dams
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dams.example.com

server {
    listen 80;
    listen [::]:80;
    server_name dams.example.com;

    # Attachments are capped at 10 MB/file; Spring's whole-request cap is 12 MB. Leave headroom.
    client_max_body_size 15m;

    # Single-page app (frontend container serves its own SPA fallback)
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API — the prefix is kept; backend routes are /api/v1/*
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
