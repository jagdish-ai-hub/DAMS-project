# DAMS production stack — one VPS, images pulled from GHCR (built by CI, never built here).
#
# The VPS keeps its own /home/server/dams/.env with the real Neon / JWT / R2 values and
# IMAGE_PREFIX. The image tag is chosen at deploy time by the CI job:
#
#   cd /home/server/dams
#   DAMS_TAG=sha-abc1234 docker compose -f compose.prod.yml pull
#   DAMS_TAG=sha-abc1234 docker compose -f compose.prod.yml up -d
#
# Roll back = run the same two commands with a previous sha- tag (every past build stays in GHCR).
#
# Containers listen on localhost only; the host's nginx (/etc/nginx/sites-available/dams)
# terminates TLS and proxies  /  -> 127.0.0.1:8083 (frontend)  and  /api/ -> 127.0.0.1:8082
# (backend).

name: dams

services:
  backend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in /home/server/dams/.env}-backend:${DAMS_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    mem_limit: 1g
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Bounded JVM footprint — SerialGC + a 448 MB max heap suit a low-concurrency CRUD API.
      # Budget under the 1 GiB container limit: heap 448 + Metaspace up to 256 + ~150 for
      # threads / code cache / native buffers ≈ 850 MiB.
      #
      # MaxMetaspaceSize was 128m, and the JVM filled it after ~1.5 days (Spring Boot + Hibernate
      # + the AWS S3 SDK + springdoc load ~24k classes). A full Metaspace does not crash the
      # process: the JVM spins a core at 100% in GC and fails any request that needs a new class,
      # while the liveness check still passes — so Docker never restarted it (rev 90).
      #  - ExitOnOutOfMemoryError: any OOM now kills the JVM, so `restart: unless-stopped`
      #    brings it back in ~30 s instead of leaving it half-dead for days.
      #  - -Xlog:gc+metaspace: logs Metaspace size at every GC to `docker logs`, to show
      #    whether it levels off (cap was just too tight) or keeps climbing (a class leak):
      #      docker logs dams-backend-1 | grep Metaspace
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx448m -XX:+UseSerialGC -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError -Xlog:gc+metaspace=info:stdout:time,uptime"
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      # liveness, not the plain /actuator/health: the plain endpoint's DataSource check pings
      # Neon on every hit, and this fires every 10s forever -- that alone kept the Neon compute
      # permanently active around the clock, defeating autosuspend regardless of app traffic
      # (rev 43, plan.md). Liveness only asks "is the JVM alive", no DB round-trip. Postgres
      # reachability is still verified where it matters -- once per deploy, in ci.yml's health
      # check against the plain /actuator/health.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  frontend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in /home/server/dams/.env}-frontend:${DAMS_TAG:-latest}
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — busybox wget in nginx:alpine tries ::1 first and the
      # container's nginx only listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 12
