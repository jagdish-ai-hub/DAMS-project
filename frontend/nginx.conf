server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # SPA: unknown paths fall back to index.html so react-router can handle them.
    # index.html must never be cached — it's the only thing naming which hashed
    # /assets/ bundle is current, and each deploy is a fresh container where the
    # previous build's hashed files no longer exist. A cached index.html pointing
    # at a since-deleted bundle is exactly how old UI (or a half-broken page)
    # keeps showing up after a deploy that actually succeeded.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # Long-cache hashed assets — safe: Vite renames the file whenever its content changes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
